<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Auth Screen -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <h1>Welcome</h1>
      <div class="tabs">
        <button class="tab active" data-mode="signin">Sign In</button>
        <button class="tab" data-mode="signup">Create Account</button>
      </div>
      <form id="authForm">
        <input type="text" id="username" placeholder="Username" class="hidden" autocomplete="off" />
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" id="authSubmit">Sign in</button>
      </form>
      <p id="authMessage" class="status-msg"></p>
    </div>
  </div>

  <!-- Main Application -->
  <div id="app" class="app-container hidden">
    <!-- Top Navigation Bar -->
    <header class="top-nav">
      <div class="nav-left">
        <button class="nav-btn active" data-feed="fyp">For You</button>
        <button class="nav-btn" data-feed="following">Following</button>
      </div>
      <div class="nav-right">
        <button id="uploadOpenBtn" class="upload-btn">+ Upload</button>
        <button id="adminOpenBtn" class="admin-open-btn hidden">⚡ Admin</button>
        <span id="currentUser"></span>
        <button id="logoutBtn" class="logout-btn">Sign Out</button>
      </div>
    </header>

    <!-- Main Video Feed -->
    <main id="feed" class="feed-container"></main>

    <!-- Upload Modal -->
    <div id="uploadModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Upload Video</h2>
          <button id="uploadCloseBtn" class="close-btn">&times;</button>
        </div>
        <form id="uploadForm">
          <input type="file" id="videoFile" accept="video/*" required />
          <input type="text" id="caption" placeholder="Write a caption..." />
          <button type="submit" class="submit-btn">Post Video</button>
        </form>
        <p id="uploadMessage" class="status-msg"></p>
      </div>
    </div>

    <!-- Super Admin Modal -->
    <div id="adminModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>⚡ Super Admin Tools</h2>
          <button id="adminCloseBtn" class="close-btn">&times;</button>
        </div>
        <div class="admin-body">
          <label for="adminVideoSelect">Select Target Video:</label>
          <select id="adminVideoSelect" class="admin-input"></select>

          <div class="admin-action-group">
            <button id="addLikesBtn" class="admin-btn">+5,000 Likes</button>
            <button id="deleteVideoBtn" class="admin-btn danger">Delete Video</button>
          </div>
          <p id="adminMessage" class="status-msg"></p>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
