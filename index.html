<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Video App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Auth Screen -->
  <div id="authScreen">
    <div class="auth-box">
      <h2>Welcome</h2>
      <div class="auth-tabs">
        <button class="tab active" data-mode="login">Log In</button>
        <button class="tab" data-mode="signup">Sign Up</button>
      </div>
      <form id="authForm">
        <input type="text" id="username" placeholder="Username (3-20 chars)" class="hidden">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="authSubmit">Sign in</button>
      </form>
      <p id="authMessage" class="msg"></p>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="hidden">
    <header class="top-nav">
      <button class="nav-btn active" data-feed="fyp">For You</button>
      <button class="nav-btn" data-feed="following">Following</button>
    </header>

    <main id="feed" class="feed-container"></main>

    <nav class="bottom-nav">
      <button class="b-nav-btn active">Home</button>
      <button class="b-nav-btn" id="uploadOpenBtn">➕</button>
      <div class="profile-menu">
        <span id="currentUser"></span>
        <button id="adminOpenBtn" class="hidden" style="margin-left: 10px; background: #e74c3c; color: white; border: none; border-radius: 4px; padding: 2px 5px;">Admin</button>
        <button id="logoutBtn" style="margin-left: 10px;">Log out</button>
      </div>
    </nav>
  </div>

  <!-- Upload Modal -->
  <div id="uploadModal" class="modal hidden">
    <div class="modal-content">
      <span class="close" id="uploadCloseBtn">&times;</span>
      <h2>Upload Video</h2>
      <form id="uploadForm">
        <input type="file" id="videoFile" accept="video/*" required>
        <textarea id="caption" placeholder="Write a caption..." rows="3"></textarea>
        <button type="submit">Upload</button>
      </form>
      <p id="uploadMessage" class="msg"></p>
    </div>
  </div>

  <!-- Admin Modal -->
  <div id="adminModal" class="modal hidden">
    <div class="modal-content">
      <span class="close" id="adminCloseBtn">&times;</span>
      <h2>Super Admin Panel</h2>
      <select id="adminVideoSelect" style="width:100%; margin-bottom:10px; padding:8px;"></select>
      <button id="addLikesBtn" style="background:#3498db; color:white; border:none; padding:10px; width:100%; margin-bottom:10px;">Add 5,000 Likes</button>
      <button id="deleteVideoBtn" style="background:#e74c3c; color:white; border:none; padding:10px; width:100%;">Delete Video</button>
      <p id="adminMessage" class="msg"></p>
    </div>
  </div>

  <!-- Comments Modal -->
  <div id="commentsModal" class="modal hidden">
    <div class="modal-content comments-modal-content">
      <span class="close" id="commentsCloseBtn">&times;</span>
      <h2>Comments</h2>
      <div id="commentsList"></div>
      <div id="replyingToIndicator" class="hidden">
        Replying to <span id="replyingToName"></span> 
        <button id="cancelReplyBtn">x</button>
      </div>
      <form id="commentForm">
        <input type="text" id="commentInput" placeholder="Add a comment..." required>
        <button type="submit">Post</button>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
